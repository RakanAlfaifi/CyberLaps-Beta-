<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CyberLaps — Architecture Map</title>
<style>
:root{
  --bg:#0b0f19;--panel:#111827;--panel2:#0e1522;--line:#1e293b;--line2:#273449;
  --ink:#e5e7eb;--mute:#94a3b8;--dim:#64748b;--acc:#38bdf8;--up:#38bdf8;--down:#f87171;
  --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
  --ar:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arabic UI Text",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1f2a3d;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f1628,#0b0f19)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
.logo .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#38bdf8,#34d399);display:grid;place-items:center;color:#04222c;font-weight:800}
.logo small{display:block;font-weight:400;color:var(--dim);font-size:11px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{padding:3px 9px;border:1px solid var(--line2);border-radius:999px;color:var(--mute);font-size:12px;white-space:nowrap}
.stat b{color:var(--ink)}
.search{margin-inline-start:auto;position:relative}
.search input{width:360px;background:#0f1626;border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding-block:8px;padding-inline:32px 12px;outline:none;font:inherit;unicode-bidi:plaintext}
.search input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.search:before{content:"⌕";position:absolute;inset-inline-start:11px;top:6px;color:var(--dim);font-size:16px}
.search kbd{position:absolute;inset-inline-end:9px;top:8px;font:11px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
nav{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);background:#0c1220}
nav button{background:none;border:0;color:var(--mute);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;font:inherit}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.on{display:block}
#v-explorer.on,#v-cascade.on,#v-workflows.on{display:grid;grid-template-rows:minmax(0,1fr);overflow:hidden}
#v-explorer{grid-template-columns:360px 1fr}
#v-cascade{grid-template-columns:340px 1fr}
#v-workflows{grid-template-columns:310px 1fr}
.side{border-inline-end:1px solid var(--line);overflow:auto;background:var(--panel2)}
.pane{overflow:auto;padding:22px 28px 60px}
h2{font-size:18px;margin:0 0 4px}h3{font-size:13px;margin:22px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
p{margin:6px 0}
.muted{color:var(--mute)}.dim{color:var(--dim)}.mono{font-family:var(--mono)}
.empty{padding:20px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);background:#0f1626;color:#cbd5e1;font-size:12px;cursor:pointer;margin-block:2px;margin-inline:0 3px;white-space:nowrap}
.chip:hover{border-color:#3b82f6;color:#fff}
.chip.red{border-color:#5b2330;background:#1d1117;color:#fecaca}
.chip.feat{cursor:default}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid currentColor}
.legend{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 6px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mute);border:1px solid var(--line2);border-radius:999px;padding:2px 8px;cursor:pointer;user-select:none}
.lg.off{opacity:.35;text-decoration:line-through}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid{display:grid;gap:12px}
.btn{background:#13213a;border:1px solid #23406b;color:#bfdbfe;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:12px}
.btn:hover{background:#18294a}
/* tree */
.tree{padding:4px 6px 40px}
.dir>summary{list-style:none;cursor:pointer;padding:3px 6px;border-radius:6px;color:#e2e8f0;display:flex;gap:6px;align-items:center;font-weight:600}
.dir>summary::-webkit-details-marker{display:none}
.dir>summary:before{content:"▸";color:var(--dim);font-size:10px;width:10px;transition:transform .15s}
.dir[open]>summary:before{transform:rotate(90deg)}
.dir>summary:hover{background:#121a2b}
.dir .dd{font-weight:400;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.dir .cnt{font-weight:400;color:var(--dim);font-size:11px}
.kids{margin-inline-start:11px;border-inline-start:1px dashed #1e293b;padding-inline-start:4px}
.f{display:flex;align-items:center;gap:7px;padding:3px 8px;border-radius:6px;cursor:pointer;color:#cbd5e1}
.f:hover{background:#141c2e}
.f.sel{background:#16213a;outline:1px solid #2b4a74}
.f.hl-dep{background:rgba(56,189,248,.12)}.f.hl-dep .nm{color:#7dd3fc}
.f.hl-imp{background:rgba(248,113,113,.11)}.f.hl-imp .nm{color:#fca5a5}
.nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi{font-size:11px;color:var(--dim);font-family:var(--mono)}
.treehint{font-size:11px;color:var(--dim);padding:0 12px 6px;display:flex;gap:10px}
.treehint i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:4px;vertical-align:-1px}
/* detail */
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin:16px 0}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.metric b{font-size:20px;display:block}.metric span{font-size:11px;color:var(--mute)}
.break{border:1px solid #4c1d24;background:linear-gradient(180deg,#1a0f14,#120d12);border-radius:12px;padding:14px 16px;margin-top:6px}
.break h4{margin:0 0 8px;color:#fca5a5;font-size:13px}
.lvl{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.lvl>.tag{flex:none;font:11px var(--mono);color:#fca5a5;border:1px solid #5b2330;border-radius:6px;padding:2px 6px;margin-top:3px;min-width:64px;text-align:center}
.rt{border-inline-start:3px solid #fbbf24;background:#18150b;padding:8px 12px;border-radius:6px;color:#fde68a;margin-top:10px}
.guard{border-inline-start:3px solid #34d399;background:#0b1812;padding:8px 12px;border-radius:6px;color:#a7f3d0;margin-top:10px}
.welcome{max-width:720px}
/* graph */
#v-graph{background:radial-gradient(circle at 20% 0,#0f1a2e,#0b0f19 60%)}
.gbar{position:sticky;top:0;left:0;z-index:3;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:rgba(11,15,25,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.gbar label{color:var(--mute);font-size:12px;display:flex;gap:5px;align-items:center;cursor:pointer}
.gbar .legend{padding:0}
#ginfo{position:fixed;right:18px;bottom:18px;width:330px;z-index:4;display:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
svg text{font:11px Inter,"Segoe UI",sans-serif;fill:#cbd5e1;pointer-events:none}
.colh{fill:#64748b!important;font-size:10px!important;letter-spacing:.06em;text-transform:uppercase}
.gn{cursor:pointer}
.gn rect{fill:#0f1626;stroke-width:1.2}
.gn:hover rect{fill:#162238}
.ge{fill:none;stroke:#3b4a63;stroke-opacity:.28;stroke-width:1}
.focus .gn{opacity:.13}.focus .gn.sel,.focus .gn.up,.focus .gn.down{opacity:1}
.focus .ge{stroke-opacity:.03}
.gn.sel rect{fill:#1e3a5f;stroke:#fff!important;stroke-width:2}
.gn.up rect{fill:#0c2536;stroke:var(--up)!important}
.gn.down rect{fill:#2a1116;stroke:var(--down)!important}
.ge.up{stroke:var(--up);stroke-opacity:.85!important;stroke-width:1.6}
.ge.down{stroke:var(--down);stroke-opacity:.85!important;stroke-width:1.6}
.searching .gn:not(.match){opacity:.15}.searching .gn.match rect{stroke:#facc15!important;stroke-width:2}
/* cascade */
.rank{padding:6px 8px 40px}
.ri{padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.ri:hover{background:#121a2b}.ri.sel{background:#16213a;border-color:#2b4a74}
.ri .top{display:flex;gap:7px;align-items:center}
.ri .bar{height:4px;border-radius:4px;background:#1e293b;margin-top:5px;overflow:hidden}
.ri .bar i{display:block;height:100%}
.ccols{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 16px;align-items:flex-start}
.ccol{min-width:220px;max-width:240px;flex:none}
.ccol h5{margin:0 0 8px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.cc{display:flex;gap:7px;align-items:center;background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid;border-radius:8px;padding:6px 9px;margin-bottom:6px;cursor:pointer;font-size:12px}
.cc:hover{border-color:#3b82f6}
.cc.origin{background:#2a1116;border-color:#7f1d1d}
.cc.chain{background:#2a1116;border-color:#f87171;box-shadow:0 0 0 1px #f87171}
.cc small{display:block;color:var(--dim);font-size:10px}
.carr{align-self:center;color:#7f1d1d;font-size:20px;flex:none}
.gbars .row{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.gbars .track{height:8px;background:#1e293b;border-radius:6px;overflow:hidden}.gbars .track i{display:block;height:100%}
/* workflows */
.wi{padding:10px 12px;border-radius:9px;cursor:pointer;margin:4px 8px;border:1px solid transparent}
.wi:hover{background:#121a2b}.wi.sel{background:#16213a;border-color:#2b4a74}
.wi b{display:block}.wi span{font-size:12px;color:var(--mute)}
.lanes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.flow{max-width:900px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px}
.sn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid;background:#0b0f19}
.sb{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid;border-radius:10px;padding:10px 14px}
.sb.hit{box-shadow:0 0 0 2px #facc15}
.sb h4{margin:2px 0 4px;font-size:14px}
.sk{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.arrow{margin-inline-start:16px;border-inline-start:2px dashed #334155;height:30px;position:relative}
.arrow:after{content:"";position:absolute;inset-inline-start:-6px;bottom:-2px;border:5px solid transparent;border-top:7px solid #475569}
.arrow span{position:absolute;inset-inline-start:14px;top:6px;font:11px var(--mono);color:#7dd3fc}
/* overview */
.ov{max-width:1280px;margin:0 auto;padding:24px 28px 60px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0 22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{font-size:24px;display:block}.kpi span{color:var(--mute);font-size:12px}
.layer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.layer .lt{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.layer .lt b{font-size:13px}.layer .lt span{color:var(--dim);font-size:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vdown{text-align:center;color:#334155;font-size:18px;line-height:22px}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.ins ol{margin:6px 0 0;padding-inline-start:18px}.ins li{margin:3px 0}
.notes li{margin:6px 0;color:#cbd5e1}
.notes b{color:#fff}
/* language switch & RTL */
.lang{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line2);border-radius:999px;background:#0f1626;flex:none}
.lang button{background:none;border:0;color:var(--mute);padding:4px 11px;border-radius:999px;cursor:pointer;font:600 12px/1.25 Inter,"Segoe UI",system-ui,sans-serif}
.lang button[lang=ar]{font-family:var(--ar);font-size:13px}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed=true]{background:#13213a;color:#fff;box-shadow:inset 0 0 0 1px #23406b}
.lang button:focus-visible{outline:2px solid #3b82f6;outline-offset:1px}
bdi,.mono{unicode-bidi:isolate}
html[lang=ar] body{font-family:var(--ar);font-size:14px;line-height:1.6}
html[lang=ar] .dd,html[lang=ar] .wi span,html[lang=ar] .cc small,html[lang=ar] .lg,html[lang=ar] .treehint{font-size:12px}
html[lang=ar] h3,html[lang=ar] .ccol h5,html[lang=ar] .sk,html[lang=ar] .colh{letter-spacing:0!important}
html[lang=ar] svg .colh,.arrow span.tr{font-family:var(--ar)}
[dir=rtl] .mono{direction:ltr}
[dir=rtl] div.mono{text-align:right}
[dir=rtl] .dir>summary:before{content:"◂"}
[dir=rtl] .dir[open]>summary:before{transform:rotate(-90deg)}
[dir=rtl] .carr{transform:scaleX(-1)}
/* the graph scroller stays LTR so scroll offsets are positive; the SVG itself is mirrored in JS */
#v-graph{direction:ltr}
[dir=rtl] .gbar,[dir=rtl] #ginfo{direction:rtl}
[dir=rtl] #ginfo{right:auto;left:18px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.ins{grid-template-columns:1fr}.search input{width:220px}}
</style>
</head>

<header>

<main>

    <div class="pane" id="detail"></div>

  <section class="view" id="v-graph">

      <div class="legend" id="lg2"></div>
    </div>
    <div id="gwrap"></div>
    <div class="card" id="ginfo"></div>
  </section>
  <section class="view" id="v-cascade">
    <aside class="side"><div style="padding:12px 14px 4px" class="dim" data-t="casc.side">Ranked by blast radius (transitive dependents, excluding tests).</div><div class="rank" id="rank"></div></aside>
    <div class="pane" id="casc"></div>
  </section>
  <section class="view" id="v-workflows">
    <aside class="side" id="wlist"></aside>
    <div class="pane" id="wflow"></div>
  </section>
</main>

/* ───────────────────────────── MODEL ───────────────────────────── */
const $=q=>document.querySelector(q);
const esc=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BIDI=s=>s==null?s:String(s).replace(/`([^`]+)`/g,"\u2066$1\u2069");
const X=p=>p.startsWith("~")?"src/"+p.slice(1):p;
const fname=id=>id.split("/").pop();
const NODES=new Map();
for(const [p,g,d,deps=[],ext=[],extra={}] of F) NODES.set(X(p),{id:X(p),g,d,dAr:BIDI(AR_FILES[p]??AR_BY_EN[d]),deps:[...new Set(deps.map(X))],ext,...extra,rtAr:BIDI(AR_RT[p]),guardAr:BIDI(AR_GUARD[p]),globalAr:BIDI(AR_GLOBAL[p]),rdeps:[]});
for(const n of NODES.values()) for(const d of n.deps){const t=NODES.get(d); if(!t){console.warn("Unknown dep",n.id,"→",d);continue;} t.rdeps.push(n.id);}
for(const n of NODES.values()) if(!n.dAr||(n.rt&&!n.rtAr)||(n.guard&&!n.guardAr)||(n.global&&!n.globalAr)) console.warn("Missing Arabic translation",n.id);
for(const k of Object.keys(DIRS)) if(!AR_DIRS[k]) console.warn("Missing Arabic folder description",k);
WORKFLOWS.forEach((w,i)=>{const a=AR_WF[i];
  if(!a||a.s.length!==w.steps.length){console.warn("Arabic workflow out of sync",w.t);return;}
  w.ta=BIDI(a.t);w.da=BIDI(a.d);w.steps.forEach((st,j)=>{st.ta=BIDI(a.s[j][0]);st.da=a.s[j][1];});});
const ALL=[...NODES.values()];
const NAMECOUNT=ALL.reduce((m,n)=>m.set(fname(n.id),(m.get(fname(n.id))||0)+1),new Map());
const base=id=>{const p=id.split("/"),f=p.pop();return (NAMECOUNT.get(f)>1||f.startsWith("index."))&&p.length?p.pop()+"/"+f:f;};
const isSrc=n=>n.id.startsWith("src/");
const SRC_CORE=ALL.filter(n=>isSrc(n)&&n.g!=="test"&&n.g!=="asset");
const EDGES=ALL.reduce((a,n)=>a+n.deps.length,0);

const IMPC=new Map(),UPC=new Map();
function impactFull(id){
  if(IMPC.has(id)) return IMPC.get(id);
  const n=NODES.get(id),lv=new Map(),par=new Map();
  if(n.global){for(const m of ALL) if(isSrc(m)&&m.g!=="asset"&&m.id!==id){lv.set(m.id,1);par.set(m.id,id);}}
  else{let fr=[id],k=0;while(fr.length){k++;const nx=[];for(const f of fr) for(const r of NODES.get(f).rdeps) if(r!==id&&!lv.has(r)){lv.set(r,k);par.set(r,f);nx.push(r);}fr=nx;}}
  const res={lv,par}; IMPC.set(id,res); return res;
}
const impactOf=id=>impactFull(id).lv;
function upstreamOf(id){
  if(UPC.has(id)) return UPC.get(id);
  const out=new Set(),st=[...NODES.get(id).deps];
  while(st.length){const x=st.pop(); if(x===id||out.has(x)||!NODES.has(x)) continue; out.add(x); st.push(...NODES.get(x).deps);}
  UPC.set(id,out); return out;
}
const impactCount=id=>[...impactOf(id).keys()].filter(i=>NODES.get(i).g!=="test").length;
const SEV={build:{l:"Build-wide",ar:"على مستوى البناء",c:"#c084fc"},crit:{l:"Critical",ar:"حرج",c:"#ef4444"},high:{l:"High",ar:"مرتفع",c:"#f97316"},med:{l:"Medium",ar:"متوسط",c:"#eab308"},low:{l:"Low",ar:"منخفض",c:"#22c55e"},none:{l:"Contained",ar:"محصور",c:"#64748b"}};
function severity(id){
  const n=NODES.get(id); if(n.global) return SEV.build;
  if(n.g==="test") return SEV.none;
  const r=impactCount(id)/SRC_CORE.length;
  return r>=.35?SEV.crit:r>=.12?SEV.high:r>=.03?SEV.med:r>0?SEV.low:SEV.none;
}
function featuresHit(id){
  const n=NODES.get(id); if(n.global) return FEATURES;
  const imp=impactOf(id); return FEATURES.filter(f=>f.files.some(x=>x===id||imp.has(x)));
}
function tarjan(){
  let i=0;const idx=new Map(),low=new Map(),on=new Set(),st=[],out=[];
  const sc=v=>{idx.set(v,i);low.set(v,i);i++;st.push(v);on.add(v);
    for(const w of NODES.get(v).deps){if(!idx.has(w)){sc(w);low.set(v,Math.min(low.get(v),low.get(w)));}else if(on.has(w)) low.set(v,Math.min(low.get(v),idx.get(w)));}
    if(low.get(v)===idx.get(v)){const c=[];let w;do{w=st.pop();on.delete(w);c.push(w);}while(w!==v);if(c.length>1) out.push(c);}};
  for(const n of ALL) if(!idx.has(n.id)) sc(n.id);
  return out;
}
const CYCLES=tarjan();
const TESTED=new Set(); for(const t of ALL.filter(n=>n.g==="test")) for(const u of upstreamOf(t.id)) TESTED.add(u);

/* ───────────────────────────── EXPLORER ───────────────────────────── */
function buildTree(){
  const root={name:"cyber-lab",path:"",children:new Map(),files:[]};
  for(const id of NODES.keys()){const parts=id.split("/");let cur=root;
    for(let i=0;i<parts.length-1;i++){const p=parts.slice(0,i+1).join("/");if(!cur.children.has(parts[i])) cur.children.set(parts[i],{name:parts[i],path:p,children:new Map(),files:[]});cur=cur.children.get(parts[i]);}
    cur.files.push(id);}
  return root;
}
const TREE=buildTree();
function dirHtml(dir,depth){
  const kids=[...dir.children.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>dirHtml(c,depth+1)).filter(Boolean);
  const files=dir.files.filter(id=>{const n=NODES.get(id);return !S.off.has(n.g)&&matchNode(n);}).sort((a,b)=>fname(a).localeCompare(fname(b)));
  if(!kids.length&&!files.length) return "";
  const inner=kids.map(k=>k.html).join("")+files.map(id=>{const n=NODES.get(id);
    return `<div class="f" data-id="${esc(id)}" title="${tip(id)}"><span class="dot" style="background:${GROUPS[n.g].color}"></span><span class="nm"><bdi>${esc(fname(id))}</bdi></span>${n.rdeps.length?`<span class="fi" title="${t("tree.rdeps")}">↑${n.rdeps.length}</span>`:""}</div>`;}).join("");
  const count=files.length+kids.reduce((a,k)=>a+k.count,0);
  if(depth===0) return {html:inner,count};
  const closed=!S.q&&(dir.path==="ex photo"||dir.path==="src/content/levels");
  const dd=esc(loc(DIRS[dir.path],AR_DIRS[dir.path])||"");
  return {count,html:`<details class="dir"${closed?"":" open"}><summary title="${dd}"><bdi>${esc(dir.name)}</bdi><span class="dd">${dd}</span><span class="cnt">${count}</span></summary><div class="kids">${inner}</div></details>`};
}
function renderTree(){
  const r=dirHtml(TREE,0);
  $("#tree").innerHTML=r?r.html:`<div class="empty">${t("nomatch")}</div>`;
  treeHL(S.sel);
}
function treeHL(id){
  const deps=id?new Set(NODES.get(id).deps):new Set(), imp=id?impactOf(id):new Map();
  document.querySelectorAll("#tree .f").forEach(el=>{const i=el.dataset.id;
    el.classList.toggle("sel",i===S.sel);el.classList.toggle("hl-dep",deps.has(i));el.classList.toggle("hl-imp",imp.has(i));});
}

function cascadeLevels(id,cls="red"){
  const lv=impactOf(id),by=new Map();
  for(const [k,v] of lv){if(!by.has(v)) by.set(v,[]);by.get(v).push(k);}
  return [...by.keys()].sort((a,b)=>a-b).map(k=>`<div class="lvl"><span class="tag">L${k} · ${by.get(k).length}</span><div>${by.get(k).sort().map(x=>chip(x,cls)).join("")}</div></div>`).join("");
}
function renderDetail(id){

    <div style="margin:8px 0 10px"><span class="dim" style="font-size:12px">${t("d.feats")}</span><br>${feats.length?feats.map(featChip).join(""):`<span class="dim">${t("d.featsNone")}</span>`}</div>${cascadeLevels(id)}`;
  $("#detail").innerHTML=`

   <div class="mono dim" style="margin-top:4px">${esc(id)}</div>
   <p style="font-size:14px;margin-top:10px">${esc(nDesc(n))}</p>
   <div class="metrics">
     <div class="metric"><b>${n.deps.length}</b><span>${t("m.deps")}</span></div>
     <div class="metric"><b>${n.rdeps.length}</b><span>${t("m.rdeps")}</span></div>
     <div class="metric"><b style="color:${sv.c}">${n.global?t("all"):imp.size}</b><span>${t("m.impact")}</span></div>
     <div class="metric"><b>${up.size}</b><span>${t("m.up")}</span></div>
   </div>
   <div class="break"><h4>${t("d.break")}</h4>${brk}</div>
   ${n.rt?`<div class="rt"><b>${t("d.rt")}</b> ${esc(loc(n.rt,n.rtAr))}</div>`:""}
   ${n.guard?`<div class="guard"><b>${t("d.guard")}</b> ${esc(loc(n.guard,n.guardAr))}</div>`:""}
   <h3>${t("d.dependsOn",{n:n.deps.length})}</h3><div>${n.deps.map(x=>chip(x)).join("")||`<span class="dim">${t("d.leaf")}</span>`}</div>
   <h3>${t("d.usedBy",{n:n.rdeps.length})}</h3><div>${n.rdeps.sort().map(x=>chip(x)).join("")||`<span class="dim">${t("d.unused")}</span>`}</div>
   ${n.ext.length?`<h3>${t("d.ext")}</h3><div>${n.ext.map(x=>`<span class="chip feat mono">${esc(x)}</span>`).join("")}</div>`:""}
   <div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:8px">

function renderWelcome(){

  $("#detail").innerHTML=`<div class="welcome"><h2>${t("w.title")}</h2><p class="muted">${t("w.body")}</p>
  <h3>${t("w.start")}</h3><div>${["src/core/state/progressStore.ts","src/core/state/stageStore.ts","src/terminal/TerminalSession.ts","src/game/scenes/NetworkScene.ts","src/core/commands/index.ts","src/core/levels/registry.ts","src/i18n/translate.ts","src/core/persistence/storage.ts"].map(x=>chip(x)).join("")}</div></div>`;

/* ───────────────────────────── GRAPH ───────────────────────────── */
let GPOS=new Map(),GW=0;
const GNW=180;
function renderGraph(){
  const ns=ALL.filter(n=>!S.off.has(n.g)&&n.g!=="config"&&n.g!=="asset"&&(S.gTests||n.g!=="test")&&(S.gContent||n.g!=="content"));
  const set=new Set(ns.map(n=>n.id)),depth=new Map(),stk=new Set();
  const dfs=id=>{if(depth.has(id)) return depth.get(id);if(stk.has(id)) return 0;stk.add(id);let d=0;
    for(const x of NODES.get(id).deps) if(set.has(x)) d=Math.max(d,dfs(x)+1);stk.delete(id);depth.set(id,d);return d;};
  ns.forEach(n=>dfs(n.id));
  const cols=[];for(const n of ns){const d=depth.get(n.id);(cols[d]||(cols[d]=[])).push(n.id);}
  for(let i=0;i<cols.length;i++) cols[i]=cols[i]||[];
  const gi=Object.keys(GROUPS);
  cols.forEach(c=>c.sort((a,b)=>gi.indexOf(NODES.get(a).g)-gi.indexOf(NODES.get(b).g)||base(a).localeCompare(base(b))));
  const yOf=new Map(),setY=()=>cols.forEach(c=>c.forEach((id,r)=>yOf.set(id,r-(c.length-1)/2)));setY();
  const bary=(c,nb)=>{const k=new Map(c.map(id=>{const ys=nb(id).filter(x=>set.has(x)).map(x=>yOf.get(x));return [id,ys.length?ys.reduce((a,b)=>a+b,0)/ys.length:yOf.get(id)];}));c.sort((a,b)=>k.get(a)-k.get(b));};
  for(let it=0;it<4;it++){
    for(let i=1;i<cols.length;i++){bary(cols[i],id=>NODES.get(id).deps);setY();}
    for(let i=cols.length-2;i>=0;i--){bary(cols[i],id=>NODES.get(id).rdeps);setY();}
  }
  const COLW=225,NW=GNW,NH=22,ROW=28,PX=24,PY=46,maxLen=Math.max(1,...cols.map(c=>c.length));
  const W=PX*2+cols.length*COLW,H=PY+24+maxLen*ROW;
  GW=W;
  const rtl=isAr(),fx=x=>rtl?W-x:x;
  GPOS=new Map();
  cols.forEach((c,ci)=>c.forEach((id,ri)=>GPOS.set(id,{x:PX+ci*COLW,y:PY+(maxLen-c.length)*ROW/2+ri*ROW})));
  let edges="",nodes="",heads="";
  cols.forEach((c,ci)=>{const hx=PX+ci*COLW,lab=`${ci===0?t("gh.leaves"):ci===cols.length-1?t("gh.entry",{n:ci}):t("gh.depth",{n:ci})} (${c.length})`;
    heads+=rtl?`<text class="colh" x="${W-hx}" y="22" text-anchor="end">\u2067${esc(lab)}\u2069</text>`:`<text class="colh" x="${hx}" y="22">${esc(lab)}</text>`;});
  for(const n of ns) for(const d of n.deps){if(!set.has(d)) continue;const a=GPOS.get(d),b=GPOS.get(n.id);
    const x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2;let p;
    if(x2>x1){const dx=Math.max(30,(x2-x1)/2);p=`M${fx(x1)},${y1} C${fx(x1+dx)},${y1} ${fx(x2-dx)},${y2} ${fx(x2)},${y2}`;}
    else p=`M${fx(a.x)},${y1} C${fx(a.x-60)},${y1} ${fx(b.x+NW+60)},${y2} ${fx(b.x+NW)},${y2}`;
    edges+=`<path class="ge" data-s="${esc(d)}" data-t="${esc(n.id)}" d="${p}"/>`;}
  for(const n of ns){const {x,y}=GPOS.get(n.id),c=GROUPS[n.g].color;let lab=base(n.id);if(lab.length>28) lab=lab.slice(0,27)+"…";
    nodes+=`<g class="gn" data-id="${esc(n.id)}" transform="translate(${rtl?W-x-NW:x},${y})"><title>${tip(n.id)}</title><rect width="${NW}" height="${NH}" rx="5" style="stroke:${c}"/><circle cx="${rtl?NW-10:10}" cy="${NH/2}" r="3.5" fill="${c}"/><text x="${rtl?NW-19:19}" y="15"${rtl?' text-anchor="end"':""}>${esc(lab)}</text></g>`;}
  $("#gwrap").innerHTML=`<svg id="gsvg" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${heads}<g>${edges}</g><g>${nodes}</g></svg>`;
  const svg=$("#gsvg");
  svg.addEventListener("click",e=>{const g=e.target.closest(".gn");if(g){S.sel=g.dataset.id;graphHL(S.sel);showGInfo(S.sel);}else{S.sel=null;graphHL(null);$("#ginfo").style.display="none";}});
  svg.addEventListener("mouseover",e=>{const g=e.target.closest(".gn");if(g) graphHL(g.dataset.id);});
  svg.addEventListener("mouseout",e=>{if(e.target.closest(".gn")&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest(".gn"))) graphHL(S.sel);});
  graphSearch(); if(S.sel&&set.has(S.sel)) graphHL(S.sel);
}
function graphHL(id){
  const svg=$("#gsvg");if(!svg) return;
  const on=id&&GPOS.has(id);svg.classList.toggle("focus",!!on);
  const up=on?upstreamOf(id):new Set(),dn=on?impactOf(id):new Map();
  svg.querySelectorAll(".gn").forEach(g=>{const i=g.dataset.id;g.classList.toggle("sel",on&&i===id);g.classList.toggle("up",up.has(i));g.classList.toggle("down",dn.has(i));});
  svg.querySelectorAll(".ge").forEach(e=>{const s=e.dataset.s,t=e.dataset.t;
    const isUp=on&&(t===id||up.has(t))&&up.has(s),isDn=on&&(s===id||dn.has(s))&&dn.has(t);
    e.classList.toggle("up",isUp);e.classList.toggle("down",isDn&&!isUp);});
}
function graphSearch(){
  const svg=$("#gsvg");if(!svg) return;svg.classList.toggle("searching",!!S.q);
  svg.querySelectorAll(".gn").forEach(g=>g.classList.toggle("match",!!S.q&&matchNode(NODES.get(g.dataset.id))));
}
function scrollGraphTo(id){const p=GPOS.get(id);if(!p) return;const v=$("#v-graph"),vx=isAr()?GW-p.x-GNW:p.x;v.scrollTo({left:Math.max(0,vx-v.clientWidth/2),top:Math.max(0,p.y-v.clientHeight/2),behavior:"smooth"});}
function graphHome(){const v=$("#v-graph");v.scrollLeft=isAr()?v.scrollWidth:0;}
function showGInfo(id){
  const n=NODES.get(id),box=$("#ginfo");if(!n){box.style.display="none";return;}
  const sv=severity(id);
  box.style.display="block";
  box.innerHTML=`<div style="display:flex;gap:8px;align-items:center"><i class="dot" style="background:${GROUPS[n.g].color}"></i><b><bdi>${esc(base(id))}</bdi></b>${sevPill(sv)}<span style="margin-inline-start:auto;cursor:pointer" class="dim" id="gx" role="button" title="${t("close")}" aria-label="${t("close")}">✕</span></div>
   <div class="mono dim" style="font-size:11px;margin:3px 0 6px">${esc(id)}</div><div style="font-size:12px">${esc(nDesc(n))}</div>
   <div style="display:flex;gap:14px;margin:10px 0;font-size:12px"><span>${t("gi.up",{n:`<b style="color:#38bdf8">${upstreamOf(id).size}</b>`})}</span><span>${t("gi.imp",{n:`<b style="color:#f87171">${impactOf(id).size}</b>`})}</span><span>${t("gi.feat",{n:`<b>${featuresHit(id).length}</b>`})}</span></div>
   <button class="btn" id="gd">${t("gi.open")}</button> <button class="btn" id="gc2">${t("gi.casc")}</button>`;
  $("#gx").onclick=()=>{box.style.display="none";S.sel=null;graphHL(null);};
  $("#gd").onclick=()=>{setView("explorer");select(id);};
  $("#gc2").onclick=()=>{S.casc=id;setView("cascade");};
}
$("#gt").onchange=e=>{S.gTests=e.target.checked;renderGraph();};
$("#gc").onchange=e=>{S.gContent=e.target.checked;renderGraph();};

/* ───────────────────────────── CASCADE ───────────────────────────── */
function rankList(){
  return ALL.filter(n=>n.g!=="asset"&&!(n.g==="config"&&!n.global)).map(n=>({id:n.id,c:n.global?Infinity:impactCount(n.id)})).sort((a,b)=>b.c-a.c||a.id.localeCompare(b.id));
}
function renderRank(){
  const list=rankList().filter(r=>matchNode(NODES.get(r.id))),max=SRC_CORE.length;
  $("#rank").innerHTML=list.map(r=>{const sv=severity(r.id),pct=r.c===Infinity?100:Math.round(r.c/max*100);
    return `<div class="ri ${S.casc===r.id?"sel":""}" data-casc="${esc(r.id)}" title="${tip(r.id)}"><div class="top"><i class="dot" style="background:${color(r.id)}"></i><span class="nm"><bdi>${esc(base(r.id))}</bdi></span><span class="fi" style="color:${sv.c}">${r.c===Infinity?t("all"):r.c}</span></div><div class="dim mono" style="font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.id)}</div><div class="bar"><i style="width:${pct}%;background:${sv.c}"></i></div></div>`;}).join("")||`<div class="empty">${t("nomatch")}</div>`;
}
$("#rank").addEventListener("click",e=>{const r=e.target.closest("[data-casc]");if(r){S.casc=r.dataset.casc;renderRank();renderCascade();}});
function renderCascade(){
  const id=S.casc,n=NODES.get(id);if(!n){$("#casc").innerHTML="";return;}
  const {lv,par}=impactFull(id),sv=severity(id),feats=featuresHit(id);
  const by=new Map();for(const [k,v] of lv){if(!by.has(v)) by.set(v,[]);by.get(v).push(k);}
  const gi=Object.keys(GROUPS);
  const card=(x,cls="")=>`<div class="cc ${cls}" data-cc="${esc(x)}" style="border-inline-start-color:${color(x)}" title="${tip(x)}"><div style="min-width:0"><div class="nm"><bdi>${esc(base(x))}</bdi></div><small>${esc(gLabel(NODES.get(x).g))}</small></div></div>`;
  const cols=[`<div class="ccol"><h5>${t("c.origin")}</h5>${card(id,"origin")}${n.deps.length?`<h5 style="margin-top:14px">${t("c.relies")}</h5>${n.deps.map(x=>chip(x)).join("")}`:""}</div>`];
  for(const k of [...by.keys()].sort((a,b)=>a-b)){
    const xs=by.get(k).sort((a,b)=>gi.indexOf(NODES.get(a).g)-gi.indexOf(NODES.get(b).g)||base(a).localeCompare(base(b)));
    cols.push(`<div class="carr">➜</div><div class="ccol"><h5>${k===1?t("c.direct"):t("c.level",{k})} · ${xs.length}</h5>${xs.map(x=>card(x)).join("")}</div>`);
  }
  const grp=new Map();for(const x of lv.keys()){const g=NODES.get(x).g;grp.set(g,(grp.get(g)||0)+1);}
  const gmax=Math.max(1,...grp.values());
  $("#casc").innerHTML=`
   <div class="dhead"><h2><bdi>${esc(base(id))}</bdi></h2>${sevPill(sv)}<span class="mono dim">${esc(id)}</span></div>
   <p class="muted">${esc(nDesc(n))}</p>
   ${n.global?`<div class="break"><h4>${t("c.build")}</h4><p style="color:#fecaca">${esc(loc(n.global,n.globalAr))}</p></div>`:""}
   ${n.rt?`<div class="rt"><b>${t("d.rt")}</b> ${esc(loc(n.rt,n.rtAr))}</div>`:""}
   ${n.guard?`<div class="guard"><b>${t("d.guard")}</b> ${esc(loc(n.guard,n.guardAr))}</div>`:""}
   <h3>${t("c.feats",{a:feats.length,b:FEATURES.length})}</h3><div>${feats.map(featChip).join("")||`<span class="dim">${t("c.featsNone")}</span>`}</div>
   ${!n.global&&lv.size?`<h3>${t("c.chain")}</h3><div class="ccols" id="ccols">${cols.join("")}</div>
   <h3>${t("c.layers")}</h3><div class="gbars card">${[...grp.entries()].sort((a,b)=>b[1]-a[1]).map(([g,c])=>`<div class="row"><span><i class="dot" style="background:${GROUPS[g].color}"></i> ${esc(gLabel(g))}</span><div class="track"><i style="width:${c/gmax*100}%;background:${GROUPS[g].color}"></i></div><b>${c}</b></div>`).join("")}</div>`
   :(!n.global?`<div class="card" style="margin-top:14px"><span class="muted">${t("c.nothing")} ${n.g==="test"?t("c.ci"):t("c.local")}</span></div>`:"")}`;
  const cc=$("#ccols");if(!cc) return;
  cc.addEventListener("mouseover",e=>{const c=e.target.closest("[data-cc]");if(!c) return;const chain=new Set();let x=c.dataset.cc;while(x&&x!==id){chain.add(x);x=par.get(x);}
    cc.querySelectorAll("[data-cc]").forEach(el=>el.classList.toggle("chain",chain.has(el.dataset.cc)));});
  cc.addEventListener("mouseleave",()=>cc.querySelectorAll(".chain").forEach(el=>el.classList.remove("chain")));
  cc.addEventListener("click",e=>{const c=e.target.closest("[data-cc]");if(c&&c.dataset.cc!==id){S.casc=c.dataset.cc;renderRank();renderCascade();}});
}

/* ───────────────────────────── WORKFLOWS ───────────────────────────── */
const wfMatch=w=>qmatch(w.t,w.d,w.ta,w.da,...w.steps.flatMap(st=>[st.t,st.d,st.ta,st.da,...st.f]));
const stepMatch=st=>!!S.q&&qmatch(st.t,st.d,st.ta,st.da,...st.f);
function renderWfList(){
  const list=WORKFLOWS.map((w,i)=>({w,i})).filter(({w})=>wfMatch(w));
  if(list.length&&!list.some(x=>x.i===S.wf)) S.wf=list[0].i;
  $("#wlist").innerHTML=`<div style="padding:12px 14px 4px" class="dim">${t("wf.count",{a:list.length,b:WORKFLOWS.length})}</div>`+list.map(({w,i})=>`<div class="wi ${i===S.wf?"sel":""}" data-wf="${i}"><b>${esc(loc(w.t,w.ta))}</b><span>${esc(loc(w.d,w.da))}</span><div class="dim" style="font-size:11px;margin-top:3px">${t("wf.meta",{s:w.steps.length,f:new Set(w.steps.flatMap(s=>s.f)).size})}</div></div>`).join("");
  renderFlow();
}
$("#wlist").addEventListener("click",e=>{const w=e.target.closest("[data-wf]");if(w){S.wf=+w.dataset.wf;renderWfList();}});
function renderFlow(){
  const w=WORKFLOWS[S.wf];
  const files=[...new Set(w.steps.flatMap(s=>s.f))].filter(x=>NODES.has(x));
  const weakest=files.filter(x=>isSrc(NODES.get(x))).sort((a,b)=>impactCount(b)-impactCount(a)).slice(0,3);
  const kl=k=>esc(loc(k.l,k.ar));
  $("#wflow").innerHTML=`<div class="flow"><h2>${esc(loc(w.t,w.ta))}</h2><p class="muted">${esc(loc(w.d,w.da))}</p>
   <div class="lanes">${Object.values(KINDS).map(k=>`<span class="chip feat"><i class="dot" style="background:${k.c}"></i>${kl(k)}</span>`).join("")}</div>
   ${w.steps.map((st,i)=>{const k=KINDS[st.k],a=st.a&&loc(st.a,AR_ARROW[st.a]),aCls=isAr()&&AR_ARROW[st.a]?' class="tr"':"";return `<div class="step"><div class="sn" style="border-color:${k.c};color:${k.c}">${i+1}</div><div class="sb ${stepMatch(st)?"hit":""}" style="border-inline-start-color:${k.c}"><div class="sk" style="color:${k.c}">${kl(k)}</div><h4>${esc(loc(st.t,st.ta))}</h4><p class="muted">${esc(loc(st.d,st.da)).replace(/`([^`]+)`/g,'<span class="mono" style="color:#e2e8f0">$1</span>')}</p><div>${st.f.map(x=>chip(x)).join("")}</div></div></div>${i<w.steps.length-1?`<div class="arrow">${a?`<span${aCls}><bdi>${esc(a)}</bdi></span>`:""}</div>`:""}`;}).join("")}
   <h3>${t("wf.risk")}</h3><div class="card">${weakest.map(x=>`<div style="margin:4px 0">${chip(x)} ${sevPill(severity(x))} <span class="dim">${t("wf.deps",{n:impactCount(x)})}</span></div>`).join("")}</div></div>`;
}

/* ───────────────────────────── SEARCH & INIT ───────────────────────────── */
$("#q").addEventListener("input",e=>{
  S.q=e.target.value.trim().toLowerCase();
  if(S.view==="overview"&&S.q) setView("explorer");
  renderTree();graphSearch();renderRank();renderWfList();
});
document.addEventListener("keydown",e=>{
  /* e.code covers the physical "/" key on layouts (e.g. Arabic) where it types another character */
  const slash=e.key==="/"||(e.code==="Slash"&&!e.shiftKey&&!e.ctrlKey&&!e.altKey&&!e.metaKey);
  if(slash&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();}
  if(e.key==="Escape"){$("#q").value="";$("#q").dispatchEvent(new Event("input"));$("#q").blur();}
});

/* ───────────────────────────── LANGUAGE ───────────────────────────── */
function renderStats(){
  $("#stats").innerHTML=[[ALL.length,"stat.files"],[SRC_CORE.length,"stat.modules"],[EDGES,"stat.edges"],[CYCLES.length,"stat.cycles"]].map(([v,k])=>`<span class="stat">${t(k,{n:v})}</span>`).join("");
}
function applyLang(){
  const h=document.documentElement;
  h.lang=S.lang;h.dir=isAr()?"rtl":"ltr";document.title=t("doc.title");
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelectorAll("[data-th]").forEach(el=>{el.innerHTML=t(el.dataset.th);});
  document.querySelectorAll("[data-tph]").forEach(el=>{el.placeholder=t(el.dataset.tph);});
  document.querySelectorAll("[data-taria]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.taria));});
  document.querySelectorAll("#lang [data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===S.lang)));
}
function setLang(l){
  if(l===S.lang||!UI[l]) return;
  S.lang=l;
  try{localStorage.setItem(LANG_KEY,l);}catch(e){}
  applyLang();renderStats();legend($("#lg1"));legend($("#lg2"));
  renderOverview();renderTree();
  S.detail?renderDetail(S.detail):renderWelcome();
  renderRank();if(S.casc) renderCascade();
  renderWfList();
  S.gHome=true;
  if(S.view==="graph") setView("graph"); else renderGraph();
}
